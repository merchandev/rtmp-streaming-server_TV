user root;
include /etc/nginx/modules/*.conf;

# Worker único para evitar timeouts en relay interno de RTMP
worker_processes 1;
rtmp_auto_push off;
error_log /dev/stdout info;

events {
    worker_connections 1024;
}

# ==============================================================
# BLOQUE RTMP — Recepción desde OBS y generación de HLS
# ==============================================================
rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        # Punto de ingesta desde OBS (rtmp://ip/live)
        application live {
            live on;
            record off;
            
            # Requerir autenticación para publicar
            on_publish http://127.0.0.1:8080/auth;
            notify_method get;

            # Relay al endpoint HLS con nombre de stream fijo
            push rtmp://127.0.0.1:1935/hls/mistream;
        }

        # Generador de segmentos HLS
        application hls {
            live on;
            record off;

            hls on;
            hls_path /tmp/hls;
            hls_fragment 2s;
            hls_playlist_length 30s;
            hls_nested off;
            hls_cleanup on;
        }
    }
}

# ==============================================================
# BLOQUE HTTP — Solo escucha en :80 (Traefik termina el SSL)
# Traefik recibe en :443, valida el certificado y reenvía
# el tráfico internamente a este contenedor en :80 (HTTP plano).
# NO hay redirect a HTTPS aquí — eso lo hace Traefik.
# ==============================================================
http {
    include       mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;
    error_log  /dev/stdout info;

    sendfile       on;
    keepalive_timeout 65;

    # ----------------------------------------------------------
    # Servidor Interno de Autenticación RTMP
    # ----------------------------------------------------------
    server {
        listen 8080;
        server_name localhost;

        location /auth {
            # Lee el nombre de la corriente (stream key) de la transmisión
            if ($arg_name = 'mistream_GOku1896') {
                return 201; # Permitir
            }
            return 401; # Bloquear
        }
    }

    server {
        listen 80;
        server_name tv.monagasvision.com localhost;

        # ----------------------------------------------------------
        # Estadísticas RTMP (XML)
        # ----------------------------------------------------------
        location = /stat {
            rtmp_stat all;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        }

        # ----------------------------------------------------------
        # Segmentos HLS — Con CORS para el plugin de WordPress
        # URL final: https://tv.monagasvision.com/hls/mistream.m3u8
        # ----------------------------------------------------------
        location /hls/ {
            alias /tmp/hls/;

            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t              ts;
            }

            # Sin caché para live streaming
            add_header Cache-Control "no-cache" always;

            # CORS — permite que monagasvision.com cargue el stream
            add_header Access-Control-Allow-Origin  "https://monagasvision.com" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;

            # Responder a preflight OPTIONS
            if ($request_method = OPTIONS) {
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }

        # ----------------------------------------------------------
        # Player Web integrado (página de visualización directa)
        # ----------------------------------------------------------
        location / {
            root  /usr/share/nginx/html;
            index index.html;
            add_header Access-Control-Allow-Origin "https://monagasvision.com" always;
        }
    }
}
